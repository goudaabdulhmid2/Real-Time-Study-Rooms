services:
  postgres:
    image: postgres:17
    container_name: study-rooms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: study_rooms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_user -d study_rooms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: